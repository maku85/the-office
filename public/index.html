<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Office</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <section id="stage">
        <canvas id="office" width="960" height="624"></canvas>
        <div id="conn" class="offline">connecting…</div>
        <div id="sysbar" hidden></div>
      </section>

      <aside id="panel">
        <h1>The Office <button id="sound-toggle" type="button" title="notification sounds: off">🔇</button></h1>

        <div class="block">
          <h2>Approvals</h2>
          <ul id="approvals"><li class="empty">none pending</li></ul>
        </div>

        <div class="block" id="plan-block" hidden>
          <h2>Plan review</h2>
          <ul id="plan"></ul>
        </div>

        <div class="block">
          <h2>Goals</h2>
          <ul id="goals"><li class="empty">no goals yet</li></ul>
        </div>

        <div class="block">
          <h2>Task board</h2>
          <ul id="tasks"><li class="empty">no tasks yet</li></ul>
        </div>

        <div class="block">
          <h2>Usage</h2>
          <ul id="usage"><li class="empty">nothing measured yet</li></ul>
        </div>

        <div class="block">
          <h2>Memory</h2>
          <ul id="memory"><li class="empty">nothing on record</li></ul>
        </div>

        <div class="block grow">
          <h2>Activity</h2>
          <ul id="log"></ul>
        </div>

        <form id="command">
          <input id="command-input" type="text" autocomplete="off"
                 placeholder="give the office a task…" />
          <button type="submit">send</button>
          <label id="plan-approval-label" title="pause after planning to approve the task list">
            <input type="checkbox" id="plan-approval" /> confirm plan
          </label>
        </form>
      </aside>
    </main>
    <script src="/render.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
